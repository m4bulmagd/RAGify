services:
  # PostgreSQL with pgvector extension
  # PRD Reference: Infrastructure Layer Lines 85-86, 381-385
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ragify-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragify_password}
      POSTGRES_DB: ${POSTGRES_DB:-ragify_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ragify}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant Vector Database
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   container_name: ragify-qdrant
  #   restart: always
  #   ports:
  #     - "6333:6333" # HTTP API
  #     - "6334:6334" # gRPC API
  #   volumes:
  #     - qdrant_data:/qdrant/storage
  #   environment:
  #     - QDRANT__SERVICE__GRPC_PORT=6334

  # Redis for Cache & Celery
  # PRD Reference: Infrastructure Layer Lines 86, 393-398
  redis:
    image: redis:latest
    container_name: ragify-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application Observability (LLM Tracing)
  # PRD Reference: Observability Layer Lines 123, 435-444
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: ragify-phoenix
    restart: always
    ports:
      - "6006:6006" # UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      - PHOENIX_PORT=6006

  # Email Testing Service
  # PRD Reference: External Services Layer Lines 116, 477
  mailcatcher:
    image: sj26/mailcatcher:latest
    container_name: ragify-mailcatcher
    restart: always
    ports:
      - "1080:1080" # Web UI
      - "1025:1025" # SMTP
    # mailcatcher image does not typically support healthcheck easily without curl/wget which might not be in the alpine/slim image
    # keeping it simple

  # MinIO S3 Compatible Storage
  minio:
    image: minio/minio:latest
    container_name: ragify-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: always

  # MinIO Init - Create bucket
  createbuckets:
    image: minio/mc:latest
    container_name: ragify-createbuckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb myminio/${MINIO_BUCKET_NAME:-ragify-documents};
      /usr/bin/mc anonymous set public myminio/${MINIO_BUCKET_NAME:-ragify-documents};
      exit 0;
      "

  # Celery Worker for Document Processing
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ragify-celery-worker
    command: uv run celery -A app.core.celery_app worker --loglevel=info -Q default,ingestion,embeddings
    depends_on:
      - redis
      - postgres
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=${POSTGRES_USER:-ragify}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ragify_password}
      - POSTGRES_DB=${POSTGRES_DB:-ragify_db}
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - S3_BUCKET_NAME=${MINIO_BUCKET_NAME:-ragify-documents}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:4317
      - PROJECT_NAME=RAGify
      - VERSION=0.1.0
      - API_V1_STR=/api/v1
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
      # - QDRANT_HOST=qdrant
      # - QDRANT_PORT=6333
    volumes:
      - ./backend:/app
      - /app/.venv
    restart: always


volumes:
  postgres_data:
  redis_data:
  minio_data:
  # qdrant_data:
