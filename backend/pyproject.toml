[project]
name = "RAGify"
version = "0.1.0"
description = "RAGify: A simple RAGify application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.1",
    "cryptography>=46.0.3",
    "fastapi[standard]>=0.128.0",
    "hiredis>=3.3.0",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.11",
    "asyncpg>=0.29.0",
    "greenlet>=3.0.0",
    "pydantic-settings>=2.12.0",
    "pydantic[email]>=2.12.5",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.21",
    "redis>=6.0.0,<6.5.0",
    "sqlmodel>=0.0.31",
    "uvicorn[standard]>=0.40.0",
    "celery[redis]>=5.4.0",
    "llama-index>=0.10.0",
    "llama-index-vector-stores-qdrant>=0.1.0",
    "llama-index-vector-stores-postgres>=0.1.0",
    "llama-index-embeddings-openai>=0.1.0",
    "llama-index-llms-openai>=0.1.0",
    "llama-index-llms-anthropic>=0.1.0",
    "qdrant-client>=1.7.0",
    "arize-phoenix>=2.0.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "tenacity>=8.0.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0",
    "argon2-cffi>=25.1.0",
    "boto3>=1.34.0",
    "python-magic>=0.4.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "factory-boy>=3.3.0",
    "coverage>=7.0.0",
]
